aid: planetspark
name: PlanetSpark
description: 'PlanetSpark is an Indian education-technology company headquartered in
  Gurugram, founded in 2017 by Kunal Malik and Maneesh Dhooper, that delivers live
  1:1 online classes in public speaking, spoken English, creative writing, grammar,
  debating and vlogging to K-8 learners, along with mental and Vedic mathematics,
  abacus and school-excellence programmes, plus communication courses for working
  professionals. It sells directly to parents and learners through www.planetspark.in
  as a consumer subscription; it operates no public developer programme, publishes
  no API documentation or machine-readable contract, and its only external
  integration surface is an affiliate registration programme.'
